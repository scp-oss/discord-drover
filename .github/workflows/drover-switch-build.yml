name: DroverSwitch build

on:
  push:
    paths:
      - "drover-switch/**"
      - ".github/workflows/drover-switch-build.yml"
  pull_request:
    paths:
      - "drover-switch/**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Pinned upstream release. To update drover: change the tag, run the workflow once,
  # copy the SHA-256 printed in the "Fetch upstream" step into DROVER_ZIP_SHA256, commit.
  DROVER_REPO: hdrover/discord-drover
  DROVER_TAG: "v0.9"
  DROVER_ZIP_SHA256: "9bd4f5e27ccd0e195ea0ffc5822d3057d8aad700b44b97067ab91fdb67c861a1"
  # Telegram WS proxy bundled into DroverSwitch (Services/TgWsService.cs): Flowseal/tg-ws-proxy (MIT),
  # PINNED commit - the CLI (proxy.tg_ws_proxy:main) is built into one tg-ws-proxy.exe with PyInstaller.
  # To update: change TGWS_SHA to a newer upstream commit, run the workflow, test, release.
  TGWS_REPO: Flowseal/tg-ws-proxy
  TGWS_SHA: "9f71904e1a4a282fd9e5044bbb71d59f4d30576b"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch upstream drover's version.dll and default drover-packet.bin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # DroverSwitch bundles these so it can auto-install drover into Discord's folder on first
        # run - it never modifies drover's own source, just ships the same binaries drover.exe's
        # own installer would have placed, pulled from a PINNED upstream release and verified
        # against a known SHA-256 so a changed or tampered release can't slip into the build.
        run: |
          if ($env:DROVER_TAG -eq "REPLACE_WITH_RELEASE_TAG") {
            throw "Set DROVER_TAG at the top of the workflow to an upstream release tag."
          }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "droverswitch-ci" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:DROVER_REPO/releases/tags/$env:DROVER_TAG"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No .zip asset found on $env:DROVER_REPO release $env:DROVER_TAG" }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile drover-release.zip

          $actual = (Get-FileHash -Path drover-release.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "Upstream asset: $($asset.name)"
          Write-Host "SHA-256: $actual"

          if (-not $env:DROVER_ZIP_SHA256) {
            throw "DROVER_ZIP_SHA256 is empty. If you trust the asset above, set DROVER_ZIP_SHA256 to: $actual"
          }
          if ($actual -ne $env:DROVER_ZIP_SHA256.ToLower()) {
            throw "SHA-256 mismatch for $($asset.name). Expected $env:DROVER_ZIP_SHA256 but got $actual"
          }

          Expand-Archive -Path drover-release.zip -DestinationPath drover-release
          New-Item -ItemType Directory -Force -Path drover-switch/src/DroverSwitch/Resources | Out-Null

          $dll = Get-ChildItem -Path drover-release -Filter version.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "version.dll not found inside $($asset.name)" }
          Copy-Item -Path $dll.FullName -Destination drover-switch/src/DroverSwitch/Resources/version.dll

          $packet = Get-ChildItem -Path drover-release -Filter drover-packet.bin -Recurse | Select-Object -First 1
          if ($packet) {
            Copy-Item -Path $packet.FullName -Destination drover-switch/src/DroverSwitch/Resources/drover-packet.bin
          } else {
            Write-Warning "drover-packet.bin not found inside $($asset.name) - skipping, DroverInstaller will just not seed one"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tg-ws-proxy.exe (pinned Flowseal/tg-ws-proxy CLI)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://codeload.github.com/$env:TGWS_REPO/zip/$env:TGWS_SHA" -OutFile tgws.zip
          Expand-Archive -Path tgws.zip -DestinationPath tgws-src
          $src = (Get-ChildItem tgws-src -Directory | Select-Object -First 1).FullName
          python -m pip install --upgrade pip
          python -m pip install "$src" pyinstaller
          # Thin entry point: only the CLI proxy, none of upstream's tray/GUI (customtkinter, pystray).
          "from proxy.tg_ws_proxy import main`nif __name__ == '__main__':`n    main()" | Out-File -Encoding ascii tgws_entry.py
          python -m PyInstaller --onefile --console --name tg-ws-proxy --collect-submodules proxy `
            --exclude-module customtkinter --exclude-module pystray --exclude-module tkinter tgws_entry.py
          if (-not (Test-Path dist/tg-ws-proxy.exe)) { throw "PyInstaller did not produce tg-ws-proxy.exe" }
          dist/tg-ws-proxy.exe --help | Select-Object -First 3
          New-Item -ItemType Directory -Force -Path drover-switch/src/DroverSwitch/Resources | Out-Null
          Copy-Item dist/tg-ws-proxy.exe drover-switch/src/DroverSwitch/Resources/tg-ws-proxy.exe
          Write-Host ("tg-ws-proxy.exe: {0:N1} MB" -f ((Get-Item dist/tg-ws-proxy.exe).Length / 1MB))

      - name: Restore
        run: dotnet restore drover-switch/DroverSwitch.sln

      - name: Build
        run: dotnet build drover-switch/DroverSwitch.sln -c Release --no-restore

      - name: Publish DroverSwitch
        run: dotnet publish drover-switch/src/DroverSwitch/DroverSwitch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish-app

      - name: Embed DroverSwitch into Setup's payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path drover-switch/src/DroverSwitchSetup/Resources | Out-Null
          Copy-Item -Path publish-app/DroverSwitch.exe -Destination drover-switch/src/DroverSwitchSetup/Resources/DroverSwitch.exe

      - name: Publish DroverSwitchSetup
        run: dotnet publish drover-switch/src/DroverSwitchSetup/DroverSwitchSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish-setup

      - uses: actions/upload-artifact@v4
        with:
          name: DroverSwitch
          path: publish-app/

      - uses: actions/upload-artifact@v4
        with:
          name: DroverSwitchSetup
          path: publish-setup/
